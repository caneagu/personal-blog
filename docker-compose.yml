services:
  blog:
    build:
      context: .
      dockerfile: Dockerfile
    image: personal-blog:prod
    container_name: personal-blog
    restart: unless-stopped
    init: true
    ports:
      - "${HOST_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      PORT: 8080
      BLOG_SECRET_KEY: ${BLOG_SECRET_KEY:?Set BLOG_SECRET_KEY in .env}
      BLOG_ADMIN_USER: ${BLOG_ADMIN_USER:-admin}
      BLOG_ADMIN_PASSWORD_HASH: ${BLOG_ADMIN_PASSWORD_HASH:?Set BLOG_ADMIN_PASSWORD_HASH in .env}
      BLOG_TRUSTED_HOSTS: ${BLOG_TRUSTED_HOSTS:?Set BLOG_TRUSTED_HOSTS in .env}
      BLOG_TRUST_PROXY_HEADERS: ${BLOG_TRUST_PROXY_HEADERS:-0}
      BLOG_SECURE_COOKIES: ${BLOG_SECURE_COOKIES:-1}
      BLOG_DEBUG: ${BLOG_DEBUG:-0}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-3}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-4}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-30}
      GUNICORN_GRACEFUL_TIMEOUT: ${GUNICORN_GRACEFUL_TIMEOUT:-30}
      GUNICORN_KEEPALIVE: ${GUNICORN_KEEPALIVE:-5}
      GUNICORN_MAX_REQUESTS: ${GUNICORN_MAX_REQUESTS:-1000}
      GUNICORN_MAX_REQUESTS_JITTER: ${GUNICORN_MAX_REQUESTS_JITTER:-50}
      GUNICORN_LOG_LEVEL: ${GUNICORN_LOG_LEVEL:-info}
    volumes:
      - ./content:/app/content
      - ./static/uploads:/app/static/uploads
